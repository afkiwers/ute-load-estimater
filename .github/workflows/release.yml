name: Release

# Publishing a release on GitHub builds the single-file app from the tagged
# commit, attaches it to the release as ute-load-estimator.html and publishes
# it to GitHub Pages as the gh-pages branch, served from its root.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build, stamped with the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          export APP_VERSION="$TAG"
          export APP_COMMIT="$(git rev-parse HEAD)"
          export APP_COMMIT_DATE="$(git log -1 --format=%cI)"
          export APP_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build
      - name: Attach ute-load-estimator.html to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ute-load-estimator.html --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish to GitHub Pages
        # The gh-pages branch holds only the latest release, as a single commit.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir site
          cp ute-load-estimator.html site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $TAG"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
